[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bureau-etudes-serveur"
version = "0.1.0"
description = "Plateforme Agent Bureau d'Études — serveur (API, données, tâches)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "playwright>=1.60.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
# Lecture des documents (phase P1) : texte natif des PDF (pypdf) et OCR local RapidOCR (ONNX,
# français + anglais). Facultatif : sans cet extra, l'application et ses tests fonctionnent et
# la lecture d'un document répond par une erreur claire. Installation : pip install -e .[lecture]
lecture = [
    "pypdf>=5.0",
    "rapidocr>=2.0",
    "onnxruntime>=1.18",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]
