code_portail: campus_france_reel
code_demarche: campus_france
nom_portail: "Études en France (Campus France Algérie) — Portail officiel"
mode_portail: reel
# Règle 6 : statut initial 'non testé' tant que l'opérateur humain n'a pas validé sur le portail réel
statut_test_initial: "non testé"

# ATTENTION — SÉLECTEURS NON TESTÉS : les sélecteurs « #eef-... » et « #onglet-panier-formations-eef » ci-dessous
# ont été écrits d'après la page de démonstration et n'ont JAMAIS été validés sur le vrai portail Études en France.
# Le vrai portail est une application React dont les identifiants sont générés (ex. « input-:rc5: ») : ne JAMAIS
# s'appuyer sur des id ni des classes CSS. Le statut reste « non testé » tant que l'administrateur n'a pas attesté la
# validation sur portail réel (Règle 6).
#
# PANIER DE VŒUX (action « ajouter_voeux_panier ») : elle n'utilise PAS les sélecteurs ci-dessous mais le profil
# `PROFIL_PANIER_REEL` (serveur/app/agent_local/portails/panier_voeux.py), écrit d'après la structure OBSERVÉE le
# 2026-11-11 (docs/portail_etudes_en_france_reel.md) avec des locators par rôle, libellé et texte :
#   - fenêtre fixée à 1280x900 (sous ~900 px le site passe en affichage mobile et cache les filtres) ;
#   - /catalogue-formations : champ « Libellé de la formation », bouton « Rechercher », résultats = liens
#     /catalogue-formations/formation/{id}/site/{idSite}, filtrés côté client (intitulé ET établissement exacts) ;
#   - fiche formation : un bloc par niveau d'entrée (« Bac +4 », « Bac +5 »…) avec son bouton « Ajouter au panier » ;
#     le champ `niveau` du vœu choisit le bloc (absent ou sans correspondance avec plusieurs blocs => « ambigu ») ;
#   - GET de lecture /parcours-api/espace-etudiant/catalogue/formations/{id}/site/{idSite} (ferme, ajouteAuPanier) ;
#     le POST de recherche (corps inconnu) n'est JAMAIS appelé ;
#   - /mon-dossier-candidature/panier-formations : un `article` par formation, dépliage « Texte de motivation »
#     (bouton sans nom accessible), éditeur riche (iframe, contenteditable ou textarea, essayés dans cet ordre),
#     compteur « n/5000 caractères maximum » (limite côté Co-Pilote : 4 000), « Enregistrer » de l'article seul.
# JAMAIS cliqués (Règle 1) : « Supprimer », « Soumettre mon dossier de candidature », les deux cases de certification
# et tout bouton dont le nom contient « certifie ».
# Tant que le portail n'est pas homologué, l'action est REFUSÉE sur ce portail (elle ne fonctionne que sur
# /demo/campus-france et sur la maquette fidèle /demo/eef-reel, réservée aux tests). Pour recalibrer, lancer l'action
# « cartographier_page » pendant une session supervisée où l'humain est connecté : elle écrit la structure de la page
# (sans valeurs ni clic) dans serveur/donnees/stockage/calibration/<horodatage>.json.

# Règle 7 : URL officielle et domaines autorisés en configuration YAML (jamais en dur dans le code)
url_officielle: "https://pastel.diplomatie.gouv.fr/etudesenfrance"
# Relevé des pages de connexion / création de compte (lecture seule, sans connexion) : voir docs/sources_demarches.md.
# La connexion et l'inscription n'utilisent AUCUN fournisseur d'identité externe (formulaires sur le domaine lui-même).
domaines_autorises:
  # vérifié le 2026-11-13 sur https://etudesenfrance.diplomatie.gouv.fr/connexion (connexion, formulaire sur le même
  # hôte), /inscription (création de compte) et /connexion/mot-de-passe-oublie
  - "etudesenfrance.diplomatie.gouv.fr"
  # vérifié le 2026-11-13 sur https://pastel.diplomatie.gouv.fr/etudesenfrance (redirige vers
  # /etudesenfrance/dyn/public/authentification/login.html, ancienne page de connexion qui renvoie vers
  # etudesenfrance.diplomatie.gouv.fr/connexion et /inscription)
  - "pastel.diplomatie.gouv.fr"
  # vérifié le 2026-11-13 sur https://www.algerie.campusfrance.org/utilisation-de-la-plateforme-etudes-en-france
  # (lien « créer un compte » vers etudesenfrance.diplomatie.gouv.fr)
  - "www.algerie.campusfrance.org"
  # vérifié le 2026-11-13 sur https://algerie.campusfrance.org/ (redirige vers https://www.algerie.campusfrance.org/)
  - "algerie.campusfrance.org"
  # vérifié le 2026-11-13 sur https://www.algerie.campusfrance.org/campagne-etudes-en-france-2027 (lien « je paye les
  # frais de dossier en ligne » ; https://paiement.if-algerie.com/ redirige vers /verifier-statut)
  - "paiement.if-algerie.com"
chemin_url: "/etudesenfrance"

# Règle 3 : l'agent vérifie que la session a été ouverte par l'humain dans le navigateur (zéro mot de passe stocké)
temoin_session_ouverte: "#bandeau-identite-candidat"
detecteur_session_fermee: "#formulaire-connexion-eef"

# Règle 2 : pause immédiate si un CAPTCHA ou un contrôle 2FA apparaît
detecteurs_blocage_securite:
  - "#bloc-captcha-eef"
  - "#bloc-2fa-eef"
  - ".g-recaptcha"
  - "iframe[src*='recaptcha']"

# Règle 1 (Option A) : sélecteurs de soumission finale sur lesquels tout clic automatique est formellement interdit
selecteurs_soumission_interdits:
  - "#btn-soumettre-dossier-eef"
  - "button[data-action-officielle='soumettre-dossier-eef']"
  - "input[type='submit'][value*='Soumettre le dossier']"
  - "button.eef-submit-final"

# Bouton d'enregistrement de rubrique / brouillon (autorisé : ne soumet pas le dossier)
selecteur_enregistrer_brouillon: "#btn-enregistrer-rubrique-eef"

# Étapes séquentielles idempotentes en mode « pré-remplissage + capture de contrôle + arrêt avant envoi »
etapes_automatisation:
  - code_etape: ouverture_session_etudes_en_france
    type_action: verifier_session_et_securite

  - code_etape: saisie_informations_personnelles
    type_action: remplir_champs
    selecteur_navigation_onglet: "#onglet-informations-personnelles-eef"
    cliquer_brouillon_apres: true
    prendre_capture_etape: true
    champs:
      # Sélecteurs distincts pour le nom et le prénom (correction du défaut D2)
      - champ_candidat: nom
        selecteur: "#eef-nom-famille"
        type_champ: texte
      - champ_candidat: prenom
        selecteur: "#eef-prenom-candidat"
        type_champ: texte
      - champ_candidat: sexe
        selecteur: "#eef-civilite-sexe"
        type_champ: liste
      - champ_candidat: date_naissance
        selecteur: "#eef-date-naissance"
        type_champ: date_iso
      - champ_candidat: lieu_naissance
        selecteur: "#eef-ville-naissance"
        type_champ: texte
      - champ_candidat: nationalite
        selecteur: "#eef-nationalite"
        type_champ: texte
      - champ_candidat: pays_residence
        selecteur: "#eef-pays-residence"
        type_champ: texte
      - champ_candidat: email
        selecteur: "#eef-email-contact"
        type_champ: texte
      - champ_candidat: telephone
        selecteur: "#eef-telephone-mobile"
        type_champ: texte
      - champ_candidat: numero_passeport
        selecteur: "#eef-numero-piece-identite"
        type_champ: texte
      - champ_candidat: date_expiration_passeport
        selecteur: "#eef-date-validite-piece"
        type_champ: date_iso

  - code_etape: saisie_cursus_et_diplomes
    type_action: remplir_et_televerser
    selecteur_navigation_onglet: "#onglet-cursus-diplomes-eef"
    cliquer_brouillon_apres: true
    prendre_capture_etape: true
    champs:
      - champ_candidat: niveau_actuel
        selecteur: "#eef-dernier-niveau-etudes"
        type_champ: texte
    fichiers:
      - type_piece: passeport
        selecteur: "#eef-upload-passeport"
        obligatoire: true
      - type_piece: photo_identite
        selecteur: "#eef-upload-photo-identite"
        obligatoire: true
      - type_piece: releve_notes_bac
        selecteur: "#eef-upload-releve-bac"
        obligatoire: true
      - type_piece: diplome_bac
        selecteur: "#eef-upload-diplome-bac"
        obligatoire: true
      - type_piece: releves_notes_superieur
        selecteur: "#eef-upload-releves-superieur"
        obligatoire: true
      - type_piece: cv
        selecteur: "#eef-upload-cv"
        obligatoire: true

  # Étape héritée de la démo (sélecteurs « #eef-... » non testés). Le panier réel passe par l'action dédiée
  # « ajouter_voeux_panier » (profil PROFIL_PANIER_REEL, locators par rôle/texte) et non par cette étape.
  - code_etape: selection_formations_et_motivations
    type_action: remplir_champs
    selecteur_navigation_onglet: "#onglet-panier-formations-eef"
    cliquer_brouillon_apres: true
    prendre_capture_etape: true
    champs:
      - champ_candidat: programme_vise
        selecteur: "#eef-intitule-formation-visee"
        type_champ: texte
      - champ_candidat: etablissement_vise
        selecteur: "#eef-etablissement-accueil"
        type_champ: texte

  - code_etape: controle_avant_validation_humaine
    type_action: capture_et_arret_avant_envoi
    selecteur_temoin_pret: "#temoin-rubriques-completes-eef"
