    - https://www.algerie.campusfrance.org/tests-et-examens-de-langue-francaise
  avertissement: >
    Les labels sont ceux affichés par les écoles ; à recouper sur France Compétences (RNCP),
    CTI, CGE et les listes MESR (grade de master, EESPIG). Les frais changent chaque année.

