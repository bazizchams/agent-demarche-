# Catalogue d'écoles privées françaises (étudiants algériens)
# Voir docs/ecoles_privees_france.md pour la méthode et les mises en garde.
# Règle : uniquement des données lues sur la page source ; null ou "à vérifier" sinon.
# frais_annuels_eur : montant annuel principal relevé (programme phare, 1re année d'entrée indiquée) ; détail dans frais_detail.
# connectee_etudes_en_france : true seulement si la page de l'école le dit ; null = non vérifié
# (la liste officielle Campus France en PDF n'a pas pu être lue).

meta:
  consulte_le: "2026-11-13"
