instructions_agent: >-
  Procédure « Créer ou reprendre un compte Études en France » (Algérie). Sources : docs/sources_demarches.md (relevé du
  2026-11-13). Domaines admis (Règle 6) : etudesenfrance.diplomatie.gouv.fr, pastel.diplomatie.gouv.fr,
  www.algerie.campusfrance.org, algerie.campusfrance.org, paiement.if-algerie.com ; refuser tout autre hôte.
  1) Vérifier la fiche (Règle 4) : nom, prénom, adresse mail du candidat, téléphone, adresse, passeport valide, consentement
  écrit. Ne rien inventer : signaler chaque manque.
  2) Demander au conseiller si le candidat a déjà un compte. Si oui, ne jamais en créer un nouveau (consigne officielle).
  3) Création : page https://etudesenfrance.diplomatie.gouv.fr/connexion puis lien « S'inscrire ». Préparer Prénom, Nom,
  Espace Campus France de résidence = « Espace Campus France Algérie », Région de résidence (libellé exact à vérifier à
  l'écran, d'après l'adresse ; espaces : Alger, Annaba, Constantine, Oran, Tlemcen), adresse mail du candidat (jamais
  celle de l'agence). Le mot de passe (12 caractères, minuscule, majuscule, chiffre, caractère spécial) est choisi et
  saisi par le conseiller, puis enregistré au coffre chiffré (Règle 3) ; il n'apparaît jamais dans les notes, journaux,
  captures ou messages. La case de consentement et la case France Alumni sont cochées par le conseiller seulement, sur
  décision du candidat. Le clic sur « S'inscrire » est fait par le conseiller.
  4) Activation : forme exacte à vérifier (lien par courriel probable). Le candidat ou le conseiller ouvre le lien ; l'agent
  ne lit pas la boîte mail.
  5) Reprise : connexion avec les identifiants du coffre seulement si le portail le permet (sinon connexion manuelle).
  Mot de passe oublié : /connexion/mot-de-passe-oublie, le conseiller saisit l'adresse et envoie le lien. Compte bloqué
  ou compte d'une campagne précédente : à vérifier ; orienter vers l'Espace Campus France de rattachement.
  6) Tout CAPTCHA, code reçu par courriel ou SMS, ou double authentification : pause immédiate, la main au conseiller
  (Règle 2).
  7) Enchaîner sur la démarche campus_france : identité, parcours (au moins 2 activités), langues, panier de formations
  avec motivations. Enregistrer en brouillon uniquement.
  8) Arrêt (Règle 1) : ne jamais cliquer « Soumettre mon dossier de candidature », les cases de certification, ni payer sur
  paiement.if-algerie.com (frais à payer dans les 48 h après soumission, montants à vérifier). Produire le récapitulatif
  pour validation humaine. Entretien : rendez-vous pris par le candidat depuis son compte après validation du dossier.
