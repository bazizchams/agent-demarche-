# Orchestration de production — HTTPS automatique (Caddy 2) + PostgreSQL 16 + FastAPI
#
# Utilisation (depuis le dossier deploiement/) :
#   docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
#
# Seul Caddy publie des ports (80 et 443). PostgreSQL et le serveur ne sont joignables
# que depuis le réseau interne Docker.
#
# Les variables BE_* ne sont transmises au conteneur QUE si elles figurent dans la section
# `environment` ci-dessous : toute nouvelle variable doit y être ajoutée.

# Nom de projet fixe : les volumes s'appellent toujours agent-bureau_volume_* quel que soit le
# dossier de lancement (les scripts de sauvegarde n'en dépendent pas, mais `docker volume ls` reste lisible).
name: agent-bureau

# Rotation des journaux Docker : sans elle, les journaux json-file grossissent sans limite.
x-journalisation: &journalisation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journalisation
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_bureau}
      POSTGRES_USER: ${POSTGRES_USER:-agent_bureau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env.production}
    volumes:
      - volume_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reseau_interne

  serveur:
    build:
      context: ..
      dockerfile: deploiement/Dockerfile
    image: agent-bureau-serveur:latest
    restart: unless-stopped
    logging: *journalisation
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # --- Navigateur de l'agent en ligne (Chromium headless) ------------------------------
    # /dev/shm de 64 Mo par défaut fait planter Chromium : 1 Go. `init` récolte les processus
    # zombies de Chromium. /tmp en mémoire (borné) pour les fichiers temporaires du navigateur.
    shm_size: "1gb"
    init: true
    pids_limit: 1024
    tmpfs:
      - /tmp:size=512m,mode=1777
    # Limites du service (≈500 Mo par session de navigateur + API) : à ajuster, voir docs/DEPLOIEMENT.md.
    deploy:
      resources:
        limits:
          cpus: "${SERVEUR_LIMITE_CPU:-2.0}"
          memory: ${SERVEUR_LIMITE_MEMOIRE:-3g}
        reservations:
          memory: 512m
    environment:
      # --- Environnement et base de données -------------------------------------------
      BE_ENVIRONNEMENT: production
      BE_URL_BASE_DONNEES: postgresql+psycopg://${POSTGRES_USER:-agent_bureau}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_bureau}
      BE_DOCS_API_ACTIVES: ${BE_DOCS_API_ACTIVES:-false}
      BE_NIVEAU_JOURNAL: ${BE_NIVEAU_JOURNAL:-INFO}
      # --- Sessions et cookies (HTTPS obligatoire en production) ----------------------
      BE_COOKIE_SECURISE: "true"
      BE_NOM_COOKIE_SESSION: ${BE_NOM_COOKIE_SESSION:-be_session}
      BE_DUREE_SESSION_MINUTES: ${BE_DUREE_SESSION_MINUTES:-480}
      BE_INACTIVITE_SESSION_MINUTES: ${BE_INACTIVITE_SESSION_MINUTES:-120}
      BE_LONGUEUR_MIN_MOT_DE_PASSE: ${BE_LONGUEUR_MIN_MOT_DE_PASSE:-12}
      BE_MAX_ECHECS_CONNEXION: ${BE_MAX_ECHECS_CONNEXION:-5}
      BE_DUREE_VERROUILLAGE_MINUTES: ${BE_DUREE_VERROUILLAGE_MINUTES:-15}
      # --- Chiffrement au repos : OBLIGATOIRE sur Linux (pas de DPAPI hors Windows) ---
      BE_CLE_MAITRESSE_BASE64: ${BE_CLE_MAITRESSE_BASE64:?Definir BE_CLE_MAITRESSE_BASE64 (32 octets en Base64 urlsafe)}
      BE_TAILLE_MAX_DOCUMENT_OCTETS: ${BE_TAILLE_MAX_DOCUMENT_OCTETS:-15728640}
      BE_DUREE_VERROU_DOSSIER_SECONDES: ${BE_DUREE_VERROU_DOSSIER_SECONDES:-300}
      # --- Stockage persistant (volumes ci-dessous) -----------------------------------
      BE_DOSSIER_STOCKAGE: /srv/plateforme/donnees/documents_chiffres
      BE_DOSSIER_SAUVEGARDES: /srv/plateforme/donnees/sauvegardes_chiffrees
      # --- Conformité -----------------------------------------------------------------
      BE_VERSION_CGU_COURANTE: ${BE_VERSION_CGU_COURANTE:-CGU-2026.10}
      BE_VERSION_CONSENTEMENT_LOI_18_07: ${BE_VERSION_CONSENTEMENT_LOI_18_07:-L18-07-2026.1}
      # --- URL publique : liens des courriels, retours de paiement Stripe, pont du Co-Pilote.
      # Sans elle, en production, le pont est désactivé et les liens des courriels sont vides.
      BE_URL_PUBLIQUE_PLATEFORME: https://${DOMAINE_PLATEFORME}
      # --- Inscription libre-service des agences et durée d'essai -----------------------
      BE_INSCRIPTIONS_OUVERTES: ${BE_INSCRIPTIONS_OUVERTES:-true}
      BE_DUREE_ESSAI_JOURS: ${BE_DUREE_ESSAI_JOURS:-30}
      BE_JOURS_GRACE_IMPAYE: ${BE_JOURS_GRACE_IMPAYE:-7}
      # --- Courriels (SMTP). Sans hôte ET expéditeur : transport « memoire », RIEN n'est envoyé
      # (réinitialisation de mot de passe, vérification d'adresse impossibles) : à renseigner avant ouverture.
      BE_COURRIEL_TRANSPORT: ${BE_COURRIEL_TRANSPORT:-auto}
      BE_SMTP_HOTE: ${BE_SMTP_HOTE:-}
      BE_SMTP_PORT: ${BE_SMTP_PORT:-587}
      BE_SMTP_SECURITE: ${BE_SMTP_SECURITE:-starttls}
      BE_SMTP_UTILISATEUR: ${BE_SMTP_UTILISATEUR:-}
      BE_SMTP_MOT_DE_PASSE: ${BE_SMTP_MOT_DE_PASSE:-}
      BE_SMTP_EXPEDITEUR: ${BE_SMTP_EXPEDITEUR:-}
      # --- Facturation Stripe : webhook obligatoire (refusé si secret de développement) ;
      # clé secrète + identifiants de prix requis pour créer de vraies sessions de paiement.
      BE_STRIPE_SECRET_WEBHOOK: ${BE_STRIPE_SECRET_WEBHOOK:?Definir BE_STRIPE_SECRET_WEBHOOK (whsec_... fourni par Stripe)}
      BE_STRIPE_CLE_SECRETE: ${BE_STRIPE_CLE_SECRETE:-}
      BE_STRIPE_PRIX_STARTER: ${BE_STRIPE_PRIX_STARTER:-}
      BE_STRIPE_PRIX_PROFESSIONNEL: ${BE_STRIPE_PRIX_PROFESSIONNEL:-}
      BE_STRIPE_PRIX_ENTREPRISE: ${BE_STRIPE_PRIX_ENTREPRISE:-}
      # --- Assistant IA (Claude) : facultatif, sans clé les fonctions IA répondent 503 ---
      BE_CLE_API_ANTHROPIC: ${BE_CLE_API_ANTHROPIC:-}
      BE_MODELE_LLM: ${BE_MODELE_LLM:-claude-sonnet-5-5}
      BE_URL_API_ANTHROPIC: ${BE_URL_API_ANTHROPIC:-https://api.anthropic.com/v1/messages}
      BE_DELAI_LLM_SECONDES: ${BE_DELAI_LLM_SECONDES:-90}
      # IA alternative (Ollama, Groq, Mistral...) : BE_IA_FOURNISSEUR=openai_compatible. Voir docs/IA_GRATUITE.md (RGPD / loi 18-07).
      BE_IA_FOURNISSEUR: ${BE_IA_FOURNISSEUR:-anthropic}
      BE_IA_URL_BASE: ${BE_IA_URL_BASE:-}
      BE_IA_MODELE: ${BE_IA_MODELE:-}
      BE_IA_CLE: ${BE_IA_CLE:-}
      BE_IA_TENTATIVES: ${BE_IA_TENTATIVES:-2}
      # --- Navigateur de l'agent en ligne (désactivé par défaut) ------------------------
      # Noms vérifiés dans app/core/config.py (alias BE_NAVIGATEUR_SERVEUR_*). Attention : sans cette variable,
      # le code active le navigateur serveur PAR DÉFAUT en production ; on force donc false ici.
      BE_NAVIGATEUR_SERVEUR_ACTIF: ${BE_NAVIGATEUR_SERVEUR_ACTIF:-false}
      BE_NAVIGATEUR_SERVEUR_SESSIONS_MAX: ${BE_NAVIGATEUR_SERVEUR_SESSIONS_MAX:-3}
      BE_NAVIGATEUR_SERVEUR_INACTIVITE_MINUTES: ${BE_NAVIGATEUR_SERVEUR_INACTIVITE_MINUTES:-15}
      BE_DOSSIER_PROFILS_NAVIGATEUR: /srv/plateforme/donnees/profils_navigateur
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - volume_documents_chiffres:/srv/plateforme/donnees/documents_chiffres
      - volume_sauvegardes_chiffrees:/srv/plateforme/donnees/sauvegardes_chiffrees
      # Volume séparé : les profils (cookies de session portail) ne se mélangent pas aux documents.
      - volume_profils_navigateur:/srv/plateforme/donnees/profils_navigateur
    networks:
      - reseau_interne

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *journalisation
    depends_on:
      - serveur
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE_PLATEFORME: ${DOMAINE_PLATEFORME:?Definir DOMAINE_PLATEFORME dans .env.production}
      EMAIL_CERTIFICAT_TLS: ${EMAIL_CERTIFICAT_TLS:?Definir EMAIL_CERTIFICAT_TLS dans .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - volume_caddy_data:/data
      - volume_caddy_config:/config
    networks:
      - reseau_interne

networks:
  reseau_interne:
    driver: bridge

volumes:
  volume_postgres:
  volume_documents_chiffres:
  volume_sauvegardes_chiffrees:
  volume_profils_navigateur:
  volume_caddy_data:
  volume_caddy_config:
